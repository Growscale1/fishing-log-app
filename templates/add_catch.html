{% extends "base.html" %}

{% block content %}
<h1><i class="fa-solid fa-plus"></i> Add Catch</h1>
<div class="card">
    <form method="POST" enctype="multipart/form-data">
        <label>Photo</label>
        <input type="file" name="photo" accept="image/*">

        <label>Catch Time</label>
        <input type="datetime-local" name="timestamp" id="timestamp">
        <label>Species</label>
        <input name="species">

        <label>Lure</label>
        <input name="lure">

        <label>Technique</label>
        <input name="technique">

        <label>Location</label>
        <input name="location" id="location">

        <input type="hidden" name="photo_gps_lat" id="photo_gps_lat">
        <input type="hidden" name="photo_gps_lon" id="photo_gps_lon">

        <div class="actions" style="margin-top: 0; margin-bottom: 14px;">
            <button type="button" onclick="useMyLocation()">
                <i class="fa-solid fa-location-crosshairs"></i>
                Use My Location
            </button>
            <span id="location-status" class="muted"></span>
        </div>

        <div
            id="add-catch-map"
            style="width: 100%; height: 260px; border-radius: 12px; margin-bottom: 14px;"
        ></div>

                <label>Weight (lbs)</label>
        <input name="weight">

        <label>Length</label>
        <input name="length">

        <div class="actions" style="margin-top: 0; margin-bottom: 14px;">
            <button type="button" onclick="useCurrentWeather()">
                <i class="fa-solid fa-cloud-sun"></i>
                Use Current Weather
            </button>
            <span id="weather-status" class="muted"></span>
        </div>

        <label>Wind</label>
        <input name="wind" id="wind">

        <label>Temperature</label>
        <input name="temp" id="temp">

        <label>Cloud Coverage</label>
        <input name="cloud_cover" id="cloud_cover">

        <label>Water Temp (°F)</label>
        <input name="water_temp" id="water_temp" placeholder="Optional manual entry">

        <label>Air Pressure (inHg)</label>
        <input name="air_pressure" id="air_pressure">

        <label>Notes</label>
        <textarea name="notes" rows="4"></textarea>

        <button type="submit">Save Catch</button>
    </form>
</div>

<script>
let addCatchMap = null;
let addCatchMarker = null;

function getCurrentLocalDateTimeValue() {
    const now = new Date();
    const offset = now.getTimezoneOffset();
    const local = new Date(now.getTime() - (offset * 60 * 1000));
    return local.toISOString().slice(0, 16);
}
function initAddCatchMap() {
    if (addCatchMap) {
        return;
    }

    addCatchMap = L.map("add-catch-map").setView([41.2, -73.7], 9);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
    }).addTo(addCatchMap);
}

function updateAddCatchMap(lat, lon) {
    initAddCatchMap();

    if (addCatchMarker) {
        addCatchMap.removeLayer(addCatchMarker);
    }

    addCatchMarker = L.marker([lat, lon]).addTo(addCatchMap);
    addCatchMap.setView([lat, lon], 15);

    setTimeout(function () {
        addCatchMap.invalidateSize();
    }, 100);
}

document.addEventListener("DOMContentLoaded", function () {
    initAddCatchMap();

    const timestampInput = document.getElementById("timestamp");
    if (timestampInput && !timestampInput.value) {
        timestampInput.value = getCurrentLocalDateTimeValue();
    }
});

function useMyLocation() {
    const status = document.getElementById("location-status");
    const latInput = document.getElementById("photo_gps_lat");
    const lonInput = document.getElementById("photo_gps_lon");

    status.textContent = "Getting your location...";

    if (!navigator.geolocation) {
        status.textContent = "Location is not supported on this device/browser.";
        return;
    }

    navigator.geolocation.getCurrentPosition(
        function(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            latInput.value = lat;
            lonInput.value = lon;

            updateAddCatchMap(lat, lon);
            status.textContent = "Location captured.";
        },
        function(error) {
            if (error.code === error.PERMISSION_DENIED) {
                status.textContent = "Location permission was denied.";
            } else if (error.code === error.POSITION_UNAVAILABLE) {
                status.textContent = "Location information is unavailable.";
            } else if (error.code === error.TIMEOUT) {
                status.textContent = "Location request timed out.";
            } else {
                status.textContent = "Could not get location.";
            }
        },
        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }
    );
}

function getCurrentCoordinates() {
    return new Promise((resolve, reject) => {
        const latValue = document.getElementById("photo_gps_lat").value;
        const lonValue = document.getElementById("photo_gps_lon").value;

        if (latValue && lonValue) {
            resolve({
                latitude: latValue,
                longitude: lonValue
            });
            return;
        }

        if (!navigator.geolocation) {
            reject(new Error("Location is not supported on this device/browser."));
            return;
        }

        navigator.geolocation.getCurrentPosition(
            function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                document.getElementById("photo_gps_lat").value = lat;
                document.getElementById("photo_gps_lon").value = lon;

                updateAddCatchMap(lat, lon);

                resolve({
                    latitude: lat,
                    longitude: lon
                });
            },
            function() {
                reject(new Error("Could not get location."));
            },
            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            }
        );
    });
}

async function useCurrentWeather() {
    const status = document.getElementById("weather-status");
    const windInput = document.getElementById("wind");
    const tempInput = document.getElementById("temp");
    const cloudInput = document.getElementById("cloud_cover");
    const airPressureInput = document.getElementById("air_pressure");

    status.textContent = "Getting current weather...";

    try {
        const coords = await getCurrentCoordinates();

        const url = `https://api.open-meteo.com/v1/forecast?latitude=${coords.latitude}&longitude=${coords.longitude}&current=temperature_2m,wind_speed_10m,cloud_cover,surface_pressure`;

        const response = await fetch(url);
        const data = await response.json();

        if (!data.current) {
            status.textContent = "Current weather unavailable.";
            return;
        }

        const tempC = data.current.temperature_2m;
        const windKmh = data.current.wind_speed_10m;
        const cloud = data.current.cloud_cover;
        const pressureHpa = data.current.surface_pressure;

        const tempF = (tempC * 9 / 5) + 32;
        const windMph = windKmh * 0.621371;
        const pressureInHg = pressureHpa * 0.0295299830714;

        tempInput.value = `${tempF.toFixed(1)}°F`;
        windInput.value = `${windMph.toFixed(1)} mph`;
        cloudInput.value = `${cloud}%`;

        if (pressureHpa !== undefined && pressureHpa !== null) {
            airPressureInput.value = `${pressureInHg.toFixed(2)} inHg`;
        }

        status.textContent = "Current weather filled in.";
    } catch (error) {
        status.textContent = error.message || "Could not get current weather.";
    }
}
</script>
{% endblock %}
