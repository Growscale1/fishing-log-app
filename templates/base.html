<!doctype html>
<html>
<head>
    <title>Fishing Log</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px;
        background: #f7f7f7;
        color: #111;
    }

    h1 {
        margin-top: 0;
        margin-bottom: 10px;
        font-size: 28px;
        line-height: 1.2;
    }

    h2 {
        margin-top: 0;
        margin-bottom: 10px;
        font-size: 20px;
        line-height: 1.3;
    }

    p {
        margin: 8px 0;
        line-height: 1.5;
    }

    a, button {
        text-decoration: none;
        cursor: pointer;
    }

    .nav {
        margin-bottom: 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    .nav a {
        color: #0b57d0;
        font-weight: bold;
        background: white;
        padding: 10px 14px;
        border-radius: 10px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .card {
        background: white;
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 16px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-top: 6px;
        margin-bottom: 4px;
    }

    input, textarea, select {
        width: 100%;
        padding: 12px;
        margin-top: 4px;
        margin-bottom: 14px;
        border: 1px solid #ccc;
        border-radius: 10px;
        font-size: 16px;
        background: white;
    }

    textarea {
        min-height: 110px;
        resize: vertical;
    }

    button {
        background: #0b57d0;
        color: white;
        border: none;
        padding: 12px 18px;
        border-radius: 10px;
        font-weight: bold;
        font-size: 16px;
        min-height: 44px;
        margin-right: 8px;
    }

    .delete-button {
        background: #c62828;
    }

    ul {
        padding-left: 20px;
        margin: 0;
    }

    li {
        margin-bottom: 8px;
        line-height: 1.4;
    }

    .muted {
        color: #666;
    }

    .actions {
        display: flex;
        gap: 10px;
        align-items: stretch;
        flex-wrap: wrap;
        margin-top: 14px;
    }

    .actions a {
        background: #eef4ff;
        color: #0b57d0;
        padding: 11px 14px;
        border-radius: 10px;
        font-weight: bold;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
    }

    .inline-form {
        display: inline;
    }

    .catch-image {
        width: 100%;
        max-width: 220px;
        max-height: 220px;
        object-fit: cover;
        border-radius: 12px;
        margin-bottom: 12px;
        display: block;
        cursor: pointer;
    }

    .flash-wrap {
        margin-bottom: 16px;
    }

    .flash-message {
        background: #d4edda;
        padding: 12px 14px;
        border-radius: 10px;
        margin-bottom: 8px;
    }

    @media (min-width: 700px) {
        body {
            padding: 24px;
        }

        .grid {
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }

        .card {
            padding: 20px;
        }
    }
</style>
</head>
<body>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="flash-wrap">
      {% for message in messages %}
        <div class="flash-message">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

<div class="nav">
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('add_catch') }}">Add Catch</a>
    <a href="{{ url_for('insights') }}">Insights</a>
</div>

{% block content %}{% endblock %}
</body>
</html>
